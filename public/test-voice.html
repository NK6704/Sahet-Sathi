<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Live API Voice Tester</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .card { border: 1px solid #ccc; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
    input, select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { padding: 0.5rem 1rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    button.stop { background: #cc0000; }
    #log { background: #f5f5f5; padding: 1rem; border-radius: 4px; height: 300px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; font-size: 0.9rem; }
  </style>
</head>
<body>

  <h1>Gemini Live Voice Tester</h1>
  
  <div class="card">
    <div class="form-group">
      <label>Google API Key</label>
      <input type="password" id="apiKey" placeholder="AIzaSy...">
    </div>
    
    <div class="form-group">
      <label>Model Name</label>
      <select id="modelName">
        <option value="gemini-2.5-flash-native-audio-latest" selected>gemini-2.5-flash-native-audio-latest</option>
        <option value="gemini-2.0-flash-exp">gemini-2.0-flash-exp</option>
        <option value="gemini-3.1-flash-live-preview">gemini-3.1-flash-live-preview</option>
        <option value="gemini-2.5-flash">gemini-2.5-flash</option>
      </select>
      <small style="color:#666">Note: Live WebSocket requires models that support BidiGenerateContent.</small>
    </div>

    <div class="form-group">
      <label>API Endpoint</label>
      <select id="apiEndpoint">
        <option value="v1alpha">v1alpha (Recommended for Live)</option>
        <option value="v1beta">v1beta</option>
      </select>
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 1rem;">
      <button id="btnConnect">1. Connect & Open Mic</button>
      <button id="btnStop" class="stop" disabled>2. Force Reply (Push to Talk)</button>
    </div>
  </div>

  <div class="card">
    <label>Connection Log</label>
    <div id="log"></div>
  </div>

<script>
  function logMsg(msg, isError = false) {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    el.innerHTML += `<div style="color: ${isError ? 'red' : 'black'}">[${time}] ${msg}</div>`;
    el.scrollTop = el.scrollHeight;
  }

  const btnConnect = document.getElementById('btnConnect');
  const btnStop = document.getElementById('btnStop');
  
  let ws = null;
  let audioContext = null;
  let stream = null;
  let processor = null;

  function floatTo16BitPCM(input) {
    const buffer = new ArrayBuffer(input.length * 2);
    const view = new DataView(buffer);
    for (let i = 0; i < input.length; i++) {
      let s = Math.max(-1, Math.min(1, input[i]));
      view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return buffer;
  }

  function toBase64(buffer) {
    let binary = '';
    const bytes = new Uint8Array(buffer);
    for (let i = 0; i < bytes.byteLength; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
  }

  async function connect() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const modelName = document.getElementById('modelName').value.trim();
    const endpoint = document.getElementById('apiEndpoint').value;
    
    if (!apiKey) {
      logMsg('Error: Please enter an API key', true);
      return;
    }

    btnConnect.disabled = true;
    logMsg(`Starting test with model: ${modelName}`);

    try {
      // Step 1: Request Microphone
      logMsg('Requesting microphone access...');
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, sampleRate: 16000 }
      });
      logMsg('Microphone connected.');

      let playRawPcm = null;
      let nextStartTime = 0;
      
      // Create contexts immediately on click
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });

      playRawPcm = function(base64) {
        try {
          const binary = atob(base64);
          const pcm16 = new Int16Array(binary.length / 2);
          for (let i = 0; i < pcm16.length; i++) {
            pcm16[i] = binary.charCodeAt(i * 2) | (binary.charCodeAt(i * 2 + 1) << 8);
          }
          
          const audioBuffer = playbackContext.createBuffer(1, pcm16.length, 24000);
          const channelData = audioBuffer.getChannelData(0);
          for (let i = 0; i < pcm16.length; i++) {
            channelData[i] = pcm16[i] / 32768.0;
          }

          const source = playbackContext.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(playbackContext.destination);

          if (nextStartTime < playbackContext.currentTime) {
            nextStartTime = playbackContext.currentTime;
          }
          source.start(nextStartTime);
          nextStartTime += audioBuffer.duration;
        } catch (e) {
          logMsg(`Playback error: ${e.message}`, true);
        }
      };

      // Step 2: Open WebSocket using the API Key directly
      // Note: We use BidiGenerateContent here instead of Constrained
      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.${endpoint}.GenerativeService.BidiGenerateContent?key=${apiKey}`;
      logMsg(`Opening WebSocket to ${endpoint}...`);
      
      ws = new WebSocket(wsUrl);
      
      ws.onopen = () => {
        logMsg('WebSocket OPENED. Sending BidiGenerateContentSetup...');
        ws.send(JSON.stringify({
          setup: {
            model: `models/${modelName}`,
            generationConfig: { responseModalities: ["AUDIO"] },
            systemInstruction: { parts: [{ text: "You are a helpful assistant. Keep it short." }] }
          }
        }));
      };

      ws.onmessage = async (event) => {
        try {
          let msgText = event.data;
          if (msgText instanceof Blob) {
            msgText = await msgText.text();
          }
          const msg = JSON.parse(msgText);
          if (msg.setupComplete) {
            logMsg('✅ Setup Complete! Microphone is now streaming to Gemini.');
            btnStop.disabled = false;
            
            // Start capturing audio
            const source = audioContext.createMediaStreamSource(stream);
          processor = audioContext.createScriptProcessor(2048, 1, 1);
          
          processor.onaudioprocess = (e) => {
            if (ws.readyState !== WebSocket.OPEN) return;
            const pcm16 = floatTo16BitPCM(e.inputBuffer.getChannelData(0));
            ws.send(JSON.stringify({
              realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: toBase64(pcm16) }] }
            }));
          };
          
          source.connect(processor);
          processor.connect(audioContext.destination);
        }
        else if (msg.serverContent) {
          const modelTurn = msg.serverContent.modelTurn;
          if (modelTurn) {
            modelTurn.parts.forEach(part => {
              if (part.inlineData && part.inlineData.mimeType.startsWith("audio/pcm")) {
                logMsg(`🔊 Received Audio Chunk (${part.inlineData.data.length} bytes)`);
                playRawPcm(part.inlineData.data);
              } else if (part.text) {
                logMsg(`💬 Gemini Text: ${part.text}`);
              }
            });
          }
          if (msg.serverContent.turnComplete) {
            logMsg('✅ Gemini finished speaking.');
            btnConnect.disabled = false;
            btnStop.disabled = true;
          }
        }
        else if (msg.error) {
          logMsg(`❌ Server Error: ${JSON.stringify(msg.error)}`, true);
        }
      } catch (err) {
        logMsg(`❌ onmessage crashed: ${err.message}`, true);
      }
    };

      ws.onclose = (e) => {
        logMsg(`WebSocket closed. Code: ${e.code}, Reason: ${e.reason}`);
        btnConnect.disabled = false;
        btnStop.disabled = true;
        if (processor) { processor.disconnect(); processor = null; }
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      };

    } catch (err) {
      logMsg(`Error: ${err.message}`, true);
      btnConnect.disabled = false;
    }
  }

  btnConnect.onclick = connect;

  btnStop.onclick = () => {
    logMsg('Manual Turn Complete sent. Gemini should answer now...');
    if (ws && ws.readyState === WebSocket.OPEN) {
      if (processor) { processor.disconnect(); processor = null; }
      ws.send(JSON.stringify({
        clientContent: { turns: [{ role: "user", parts: [{ text: " " }] }], turnComplete: true }
      }));
    }
  };

</script>
</body>
</html>
