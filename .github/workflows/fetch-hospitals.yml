name: Daily PM-JAY Hospital Sync

on:
  schedule:
    # Runs at 12:00 AM IST (which is 18:30 UTC)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  sync-hospitals:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install dotenv @supabase/supabase-js node-fetch
        
      - name: Run hospital fetch script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cron-fetch-hospitals.mjs
